<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Frave - Web Chart Editor</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
        background-color: #0b0d11;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, monospace;
        user-select: none;
        -webkit-user-select: none;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: fixed;
        top: 0;
        left: 0;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        background-color: #0b0d11;
        display: block;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        color: #e2e8f0;
        font-size: 13px;
        letter-spacing: 3px;
        text-transform: uppercase;
      }
      .loading-title {
        color: #8bb2f8;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .loading-sub {
        color: #64748b;
        font-size: 11px;
        margin-bottom: 16px;
        letter-spacing: 1.5px;
      }
      #unity-progress-bar-empty {
        width: 260px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 2px;
        overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #3b82f6;
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
        transition: width 0.15s ease-out;
      }
      #web-upload-pill {
        position: fixed;
        top: 12px;
        right: 18px;
        z-index: 1000;
        background: rgba(18, 22, 28, 0.88);
        color: #8bb2f8;
        border: 1px solid rgba(139, 178, 248, 0.4);
        border-radius: 20px;
        padding: 7px 15px;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.5px;
        cursor: pointer;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
        transition: all 0.2s ease;
      }
      #web-upload-pill:hover, #web-upload-pill:active {
        background: rgba(30, 41, 59, 0.95);
        border-color: #60a5fa;
        color: #ffffff;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div class="loading-title">Frave Chart Editor</div>
        <div class="loading-sub">Loading Web Engine...</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>

    <!-- 原生 HTML 檔案選擇器 (針對 iPad / Safari 100% 防擋彈窗) -->
    <input id="webgl-file-input" type="file" accept=".zip,application/zip,application/x-zip-compressed" style="display: none;">
    <button id="web-upload-pill" onclick="document.getElementById('webgl-file-input').click()">
      📁 選擇 .ZIP 專案 (iPad / 雲端)
    </button>

    <script src="Build/WebGL_Editor.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fileInput = document.getElementById('webgl-file-input');
      var uploadPill = document.getElementById('web-upload-pill');

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL_Editor.data",
        frameworkUrl: "Build/WebGL_Editor.framework.js",
        codeUrl: "Build/WebGL_Editor.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Mistyr4in_",
        productName: "Frave",
        productVersion: "0.1",
        matchWebGLToCanvasSize: true
      }).then(function (unityInstance) {
        window.unityInstance = unityInstance;
        if (loadingBar) loadingBar.style.display = "none";
      }).catch(function (message) {
        alert("Unity WebGL Error: " + message);
      });

      function handleZipFile(file) {
        if (!file) return;
        if (!window.unityInstance) {
          alert("編輯器尚未載入完成，請等待載入完成後再選取檔案！");
          return;
        }
        if (uploadPill) uploadPill.innerText = "⏳ 載入中: " + file.name + "...";

        var reader = new FileReader();
        reader.onload = function (evt) {
          try {
            var bytes = new Uint8Array(evt.target.result);
            var tempPath = '/uploaded_project.zip';

            // 方法 1: 使用 WebFileBridge 注入的 window.UnityWriteUploadedZip
            if (typeof window.UnityWriteUploadedZip === 'function') {
              var ok = window.UnityWriteUploadedZip(bytes);
              if (ok) {
                if (uploadPill) uploadPill.innerText = "📁 選擇 .ZIP 專案 (iPad / 雲端)";
                return;
              }
            }

            // 方法 2: 使用 window.UnityFS 或 window.FS 或 Module.FS
            var fs = window.UnityFS || window.FS;
            if (!fs && window.unityInstance && window.unityInstance.Module) {
              fs = window.unityInstance.Module.FS;
            }
            if (fs && typeof fs.writeFile === 'function') {
              try { fs.unlink(tempPath); } catch (e) {}
              fs.writeFile(tempPath, bytes);
              window.unityInstance.SendMessage('EditorController', 'OnWebZipUploaded', tempPath);
              if (uploadPill) uploadPill.innerText = "📁 選擇 .ZIP 專案 (iPad / 雲端)";
              return;
            }

            // 方法 3: 使用 Module.FS_createDataFile
            var mod = window.unityInstance && window.unityInstance.Module;
            if (mod && typeof mod.FS_createDataFile === 'function') {
              try {
                if (mod.FS && mod.FS.unlink) mod.FS.unlink(tempPath);
              } catch (e) {}
              mod.FS_createDataFile('/', 'uploaded_project.zip', bytes, true, true, true);
              window.unityInstance.SendMessage('EditorController', 'OnWebZipUploaded', tempPath);
              if (uploadPill) uploadPill.innerText = "📁 選擇 .ZIP 專案 (iPad / 雲端)";
              return;
            }

            throw new Error("無法存取 WebGL 檔案系統 (FS)");
          } catch (err) {
            console.error('[WebFile] Error handling zip:', err);
            if (uploadPill) uploadPill.innerText = "❌ 載入失敗";
            alert("載入失敗: " + (err.message || err));
          }
        };
        reader.onerror = function (err) {
          console.error('[WebFile] FileReader error:', err);
          if (uploadPill) uploadPill.innerText = "❌ 檔案讀取失敗";
          alert("檔案讀取失敗，請確認檔案未損壞");
        };
        reader.readAsArrayBuffer(file);
      }

      fileInput.onchange = function (e) {
        var file = e.target.files && e.target.files[0];
        handleZipFile(file);
        fileInput.value = '';
      };

      // 支援桌面端將 .zip 專案包直接拖曳至瀏覽器視窗自動匯入
      window.addEventListener('dragover', function (e) {
        e.preventDefault();
      });
      window.addEventListener('drop', function (e) {
        e.preventDefault();
        var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (file && file.name.toLowerCase().endsWith('.zip')) {
          handleZipFile(file);
        }
      });
    </script>
  </body>
</html>
